<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Actividades</title>
<meta name="theme-color" content="#070b14">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070b14'/%3E%3Ctext x='50' y='66' font-size='56' text-anchor='middle'%3E%F0%9F%A7%B9%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#070b14;--p:#0f172a;--p2:#16213a;--t:#e6edf7;--m:#8ea0bd;--cy:#22d3ee;--mg:#e879f9;--gr:#4ade80;--rd:#f87171;--am:#fbbf24;--bl:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,#12254d55,transparent),radial-gradient(900px 500px at 100% 0,#4b1d6b44,transparent),var(--bg)}
a{color:var(--cy)}
h2,h3{margin:.2em 0 .5em}
.wrap{max-width:1250px;margin:0 auto;padding:12px 14px calc(90px + env(safe-area-inset-bottom))}
.glass{background:#0f172ad9;backdrop-filter:blur(8px);border:1px solid #ffffff14;border-radius:16px;padding:14px;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 6px var(--c),0 0 14px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 6px color-mix(in srgb,var(--c) 30%,transparent)}50%{box-shadow:0 0 12px var(--c),0 0 26px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 45%,transparent)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes flash{0%,100%{background:#7f1d1d}50%{background:#dc2626}}
.btn{--c:var(--cy);cursor:pointer;color:#fff;background:#0b1220;border:1.5px solid var(--c);border-radius:12px;padding:9px 15px;font:600 14px inherit;font-family:inherit;animation:glow 2.6s infinite;transition:transform .15s,background .2s;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--c) 22%,#0b1220);transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.big{padding:16px 22px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.4;animation:none;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
header.top{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;padding:10px 14px;background:#070b14ee;backdrop-filter:blur(8px);border-bottom:1px solid #ffffff12}
header.top h1{font-size:17px;margin:0;background:linear-gradient(90deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
input,select,textarea{width:100%;background:#0b1220;color:var(--t);border:1px solid #2b3a5c;border-radius:10px;padding:9px 11px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px #22d3ee33}
input[type=range]{padding:0;accent-color:var(--cy)}
label.f{display:block;font-size:12px;color:var(--m);margin:8px 0 3px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--c,#555);color:var(--c,#aaa);background:color-mix(in srgb,var(--c,#555) 15%,transparent)}
.stat{--c:var(--cy);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:14px;padding:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,#0f172a),#0f172a);box-shadow:0 0 14px color-mix(in srgb,var(--c) 22%,transparent);animation:rise .5s both}
.stat b{display:block;font-size:26px;color:var(--c)}
.stat span{color:var(--m);font-size:12.5px}
.bar{height:9px;border-radius:9px;background:#1e2a47;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr));border-radius:9px;transition:width .6s}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 8px;border-bottom:1px solid #ffffff12;text-align:left}
th{color:var(--m);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.muted{color:var(--m)}
/* habitaciones */
.room{--c:#22c55e;position:relative;border:2px solid var(--c);border-radius:18px;padding:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#0f172a),#0f172a);animation:glow 2.8s infinite,rise .4s both;text-align:center}
.room.limpieza{animation:glow 1s infinite,pulse 1s infinite}
.room .rn{font-size:36px;font-weight:800;color:var(--c)}
.room .rs{font-size:13px;color:var(--t);opacity:.85}
.room .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.room .bubble,.fb{background:radial-gradient(circle at 30% 30%,#fde68a,#f59e0b);color:#1a1200;font-weight:800;border-radius:99px;box-shadow:0 0 18px #f59e0b}
.room .bubble{position:absolute;top:-12px;right:-8px;padding:5px 11px;animation:float 2.2s infinite}
#fbs{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:80}
.fb{padding:10px 14px;text-align:center;animation:float 2.4s infinite;min-width:84px}
.fb small{display:block;font-size:11px;font-weight:700}
.fb b{font-size:18px}
/* modal */
.ov{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.md{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--p);border:1px solid #22d3ee66;border-radius:18px;padding:16px;box-shadow:0 0 30px #22d3ee33;animation:rise .25s both}
.alarm{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;animation:flash .6s infinite;text-align:center;padding:20px}
.alarm .ic{font-size:90px;animation:shake .4s infinite}
.alarm h1{font-size:30px;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:400;background:#0b1220;border:1px solid var(--cy);box-shadow:0 0 18px #22d3ee66;padding:10px 18px;border-radius:12px;animation:rise .3s both;max-width:90vw}
.chat{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px}
.msg{max-width:78%;padding:7px 11px;border-radius:14px;background:#1e2a47;align-self:flex-start}
.msg.me{align-self:flex-end;background:#0e5a6b}
.msg small{display:block;color:var(--m);font-size:10.5px}
.home{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.home h1{font-size:clamp(28px,6vw,52px);margin:0;background:linear-gradient(90deg,var(--cy),var(--mg),var(--am));-webkit-background-clip:text;background-clip:text;color:transparent}
.gantt{position:relative;height:16px;background:#1e2a47;border-radius:8px;margin:3px 0}
.gantt i{position:absolute;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,var(--mg),var(--cy));opacity:.9}
#mapbg{position:fixed;inset:0;z-index:0}
.car{font-size:28px;filter:drop-shadow(0 0 6px #22d3ee);animation:float 2s infinite}
.leaflet-container{background:#0b1220}
.adminlayer{position:relative;z-index:2}
.adminlayer.ghost .wrap>.glass{display:none}
.pn{background:#0f172ad0}
@media print{header,.tabs,.btn.noprint,#fbs{display:none!important}body{background:#fff;color:#000}.qrc{break-inside:avoid;border:1px solid #000;color:#000}}
@media(max-width:600px){.md{padding:12px}.room .rn{font-size:30px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useRef,useMemo,createContext,useContext}=React;

/* ============================ CONFIG SUPABASE ============================ */
const SB_URL='https://nqmmfmyalpfloumyiyzh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xbW1mbXlhbHBmbG91bXlpeXpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODA0MDUsImV4cCI6MjEwNjQ1NjQwNX0.hDfdTapM9J92JPav3I0pvUU2mUwTUj-BKEhjnPZV1bg';
const sb=supabase.createClient(SB_URL,SB_KEY);

/* ============================ CAPA DE DATOS ============================== */
const T={};
const tbl=t=>T[t]||(T[t]={rows:{},subs:new Set(),loaded:false,loading:false});
const flat=r=>({...r.data,id:r.id});
const emit=t=>{const s=tbl(t),a=Object.values(s.rows);s.subs.forEach(f=>f(a))};
async function load(t){
  const s=tbl(t);s.loading=true;
  const {data,error}=await sb.from(t).select('id,data');
  s.loading=false;
  if(error){console.error(t,error);window.__err&&window.__err('BD: '+error.message);return}
  s.rows={};data.forEach(r=>s.rows[r.id]=flat(r));s.loaded=true;emit(t);
}
sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},p=>{
  const s=T[p.table];if(!s)return;
  if(p.eventType==='DELETE')delete s.rows[p.old.id];else s.rows[p.new.id]=flat(p.new);
  emit(p.table);
}).subscribe();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)Object.keys(T).forEach(load)});
const DB={
  watch(t,cb){const s=tbl(t);s.subs.add(cb);if(s.loaded)cb(Object.values(s.rows));else if(!s.loading)load(t);return()=>s.subs.delete(cb)},
  async set(t,id,d){const s=tbl(t);const m={...(s.rows[id]||{}),...d};delete m.id;s.rows[id]={...m,id};emit(t);
    const {error}=await sb.from(t).upsert({id,data:m});if(error)window.__err&&window.__err(error.message)},
  async many(t,list){const s=tbl(t);list.forEach(([id,d])=>{s.rows[id]={...d,id}});emit(t);
    const {error}=await sb.from(t).upsert(list.map(([id,d])=>{const x={...d};delete x.id;return{id,data:x}}));if(error)window.__err&&window.__err(error.message)},
  async del(t,id){const s=tbl(t);delete s.rows[id];emit(t);await sb.from(t).delete().eq('id',id)},
};
function useCol(t){
  const [d,setD]=useState(()=>Object.values(tbl(t).rows));
  useEffect(()=>DB.watch(t,a=>setD(a)),[t]);
  return d;
}

/* ============================ UTILIDADES ================================= */
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const fmt=ms=>{ms=Math.max(0,Math.floor(ms/1000));const h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return(h?h+':':'')+pad(m)+':'+pad(s)};
const money=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-CO');
const today=()=>new Date().toISOString().slice(0,10);
const dfmt=ts=>ts?new Date(ts).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}):'—';
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROLE={admin:'Administrador',maint_admin:'Admin mantenimiento',aseo:'Aseo',mantenimiento:'Mantenimiento / Jardinería',sistemas:'Sistemas',driver:'Conductor',aux:'Auxiliar',deliv_admin:'Admin entregas'};
const ST={disponible:{c:'#22c55e',l:'Disponible'},ocupada:{c:'#3b82f6',l:'Ocupada'},limpieza:{c:'#ef4444',l:'Por limpiar'},proceso:{c:'#f59e0b',l:'En limpieza'}};
const IST={pendiente:{c:'#94a3b8',l:'Pendiente'},ruta:{c:'#60a5fa',l:'En ruta'},ok:{c:'#22c55e',l:'Entregado OK'},novedad:{c:'#fbbf24',l:'Novedad'},parcial:{c:'#fb923c',l:'Devolución parcial'},total:{c:'#ef4444',l:'Devolución total'},reenvio:{c:'#c084fc',l:'Reenvío'}};
const DONE=['ok','novedad','parcial','total','reenvio'];
const PAYS={contado:'Contado',credito:'Crédito',transferencia:'Transferencia',mixta:'Mixta'};

/* sonido / notificaciones */
let AC=null,siren=null;
const unlock=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}};
function beep(){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.4;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.25)}
function startSiren(){if(!AC||siren)return;AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=650;g.gain.value=.9;o.connect(g);g.connect(AC.destination);o.start();let hi=false;
  siren=setInterval(()=>{hi=!hi;o.frequency.setValueAtTime(hi?1000:650,AC.currentTime);navigator.vibrate&&navigator.vibrate(300)},350);siren._o=o}
function stopSiren(){if(siren){clearInterval(siren);try{siren._o.stop()}catch(e){}siren=null;navigator.vibrate&&navigator.vibrate(0)}}
function sysNotify(title,body,loud){try{if('Notification'in window&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,vibrate:loud?[600,200,600,200,900]:[200],requireInteraction:!!loud,tag:'cda-'+Date.now(),icon:'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%2780%27 font-size=%2780%27%3E%F0%9F%94%94%3C/text%3E%3C/svg%3E'}))}catch(e){}}

function useHash(){const [h,setH]=useState(location.hash);useEffect(()=>{const f=()=>setH(location.hash);addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);return h}
function useNow(){const [n,setN]=useState(Date.now());useEffect(()=>{const i=setInterval(()=>setN(Date.now()),1000);return()=>clearInterval(i)},[]);return n}
const getPos=()=>new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:5000})});

const Ctx=createContext();const useC=()=>useContext(Ctx);

/* ============================ ÁTOMOS UI ================================== */
const Btn=({c,sm,big,children,...p})=><button {...p} className={'btn'+(sm?' sm':'')+(big?' big':'')+(p.className?' '+p.className:'')} style={{'--c':c||'var(--cy)',...p.style}}>{children}</button>;
const Modal=({title,onClose,children})=><div className="ov" onMouseDown={e=>e.target===e.currentTarget&&onClose()}><div className="md"><div className="row"><h3 className="sp">{title}</h3><Btn sm c="var(--rd)" onClick={onClose}>✕</Btn></div>{children}</div></div>;
const F=({l,children})=><div><label className="f">{l}</label>{children}</div>;
const Bar=({v})=><div className="bar"><i style={{width:clamp(v||0,0,100)+'%'}}/></div>;
const Stat=({c,v,l})=><div className="stat" style={{'--c':c}}><b>{v}</b><span>{l}</span></div>;
const Chip=({c,children})=><span className="chip" style={{'--c':c}}>{children}</span>;
function Pick({users,value=[],onChange}){return <div className="row">{users.length?users.map(u=>{const on=value.includes(u.id);return <Btn key={u.id} sm c={on?'var(--gr)':'#475569'} onClick={()=>onChange(on?value.filter(x=>x!==u.id):[...value,u.id])}>{on?'✓ ':''}{u.name}</Btn>}):<span className="muted">No hay personal creado</span>}</div>}
function QR({text,size=170}){const r=useRef();useEffect(()=>{r.current.innerHTML='';new QRCode(r.current,{text,width:size,height:size,colorDark:'#000',colorLight:'#fff'})},[text]);return <div ref={r} style={{background:'#fff',padding:8,borderRadius:10,display:'inline-block'}}/>}
function Progress({v,label}){return <div><div className="row"><span className="muted sp">{label}</span><b>{Math.round(v||0)}%</b></div><Bar v={v}/></div>}

/* ============================ APP RAÍZ =================================== */
function App(){
  const hash=useHash();
  const users=useCol('users'),rooms=useCol('rooms'),cleanings=useCol('cleanings'),tasks=useCol('tasks'),works=useCol('works'),notifs=useCol('notifs'),chat=useCol('chat'),catalog=useCol('catalog'),routes=useCol('routes'),invoices=useCol('invoices'),geo=useCol('geo'),live=useCol('live');
  const [meId,setMeId]=useState(()=>localStorage.getItem('cda_me'));
  const [toast,setToast]=useState(null);
  useEffect(()=>{window.__err=m=>{setToast(m);setTimeout(()=>setToast(null),4000)}},[]);
  const msg=m=>{setToast(m);setTimeout(()=>setToast(null),3000)};
  const me=users.find(u=>u.id===meId);
  const route=hash.startsWith('#admin/mantenimiento')?'maint_admin':hash.startsWith('#admin/entregas')?'deliv_admin':hash.startsWith('#admin')?'admin':hash.startsWith('#servicio')?'aseo':hash.startsWith('#mantenimiento')?'mant':hash.startsWith('#entregas')?'entregas':'home';
  const allowed={admin:['admin'],maint_admin:['maint_admin'],aseo:['aseo'],mant:['mantenimiento','sistemas'],entregas:['driver','aux'],deliv_admin:['deliv_admin']};
  const login=u=>{localStorage.setItem('cda_me',u.id);setMeId(u.id)};
  const logout=()=>{localStorage.removeItem('cda_me');setMeId(null);stopSiren()};
  const notify=n=>DB.set('notifs',uid(),{...n,ts:Date.now(),by:me?.id});
  const ctx={me,users,rooms,cleanings,tasks,works,notifs,chat,catalog,routes,invoices,geo,live,notify,msg,logout,types:(catalog.find(c=>c.id==='types')||{}).items||[],equip:(catalog.find(c=>c.id==='equip')||{}).items||[]};
  let body;
  if(route==='home')body=<Home/>;
  else if(!me||!allowed[route].includes(me.role))body=<Login route={route} allowed={allowed[route]} onLogin={login} me={me} logout={logout}/>;
  else body=<Ctx.Provider value={ctx}><Shell>{route==='admin'?<AdminApp/>:route==='deliv_admin'?<DelivAdminApp/>:route==='maint_admin'?<MaintAdminApp/>:route==='aseo'?<CleanApp hash={hash}/>:route==='mant'?<MaintWorker/>:<DeliveryApp/>}</Shell></Ctx.Provider>;
  return <>{body}{toast&&<div className="toast">{toast}</div>}</>;
}

function Home(){
  const L=[['#servicio','🧹 Servicio / Aseo','var(--gr)'],['#mantenimiento','🔧 Mantenimiento y Jardinería','var(--am)'],['#entregas','🚚 Entregas','var(--bl)'],['#admin','👑 Administrador General','var(--mg)'],['#admin/entregas','🗺 Admin Entregas','var(--bl)'],['#admin/mantenimiento','🛠 Admin Mantenimiento','var(--cy)']];
  return <div className="home"><div style={{fontSize:70,animation:'float 3s infinite'}}>🏨</div><h1>Control de Actividades</h1><p className="muted">Aseo · Mantenimiento · Sistemas · Entregas</p>
  <div className="row" style={{justifyContent:'center'}}>{L.map(([h,t,c])=><Btn key={h} big c={c} onClick={()=>{unlock();location.hash=h}}>{t}</Btn>)}</div><InstallBtn/></div>;
}
let deferred=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
function InstallBtn(){const [s,setS]=useState(0);useEffect(()=>{const i=setInterval(()=>setS(x=>x+1),1500);return()=>clearInterval(i)},[]);return deferred?<Btn c="var(--mg)" onClick={()=>{deferred.prompt();deferred=null;setS(s+1)}}>📲 Instalar app</Btn>:null}

function Login({route,allowed,onLogin,me,logout}){
  const [u,setU]=useState(''),[p,setP]=useState(''),[busy,setBusy]=useState(false),[err,setErr]=useState('');
  const titles={admin:'Administrador General',maint_admin:'Admin. Mantenimiento y Locativos',aseo:'Servicio / Aseo',mant:'Mantenimiento y Jardinería',entregas:'Entregas',deliv_admin:'Admin. de Entregas'};
  const go=async e=>{e.preventDefault();unlock();setBusy(true);setErr('');
    const {data,error}=await sb.rpc('app_login',{p_user:u,p_pin:p});setBusy(false);
    if(error)return setErr('Error de conexión: '+error.message);
    if(!data)return setErr('Usuario o clave incorrectos');
    if(!allowed.includes(data.role))return setErr('Este usuario no pertenece a esta sección');
    onLogin(data)};

/* ============ Alertas: notificaciones + sirena ============ */
function visible(n,me){
  if(n.by===me.id)return false;
  if(me.role==='admin')return !n.chat||n.toRole==='admin';
  if(me.role==='deliv_admin')return n.dept==='entregas'&&!n.chat;
  if(n.chat)return n.toRole===me.role;
  if(n.toRole)return n.toRole===me.role;
  if(me.role==='maint_admin')return n.dept==='mantenimiento'||n.dept==='sistemas';
  if(me.role==='aseo')return n.dept==='aseo'&&(!n.targets?.length||n.targets.includes(me.id));
  if(me.role==='driver'||me.role==='aux')return n.dept==='entregas'&&n.targets?.includes(me.id);
  return (n.dept==='mantenimiento'||n.dept==='sistemas')&&n.targets?.includes(me.id);
}
function Shell({children}){
  const {me,notifs,logout}=useC();
  const seen=useRef(null),[alarm,setAlarm]=useState(null),start=useRef(Date.now());
  const vis=useMemo(()=>notifs.filter(n=>visible(n,me)).sort((a,b)=>b.ts-a.ts),[notifs,me]);
  useEffect(()=>{
    if(seen.current===null){seen.current=new Set(notifs.map(n=>n.id));if(notifs.length||Date.now()-start.current>2500)return}
    notifs.forEach(n=>{if(seen.current.has(n.id))return;seen.current.add(n.id);if(n.ts<start.current-60000||!visible(n,me))return;
      sysNotify(n.dept==='aseo'?'🧹 Aseo':n.dept==='entregas'?'🚚 Entregas':n.chat?'💬 Chat':'🔧 Mantenimiento',n.text,n.loud);
      if(n.loud){setAlarm(n);startSiren()}else beep()});
  },[notifs]);
  const ack=()=>{stopSiren();setAlarm(null)};
  return <><div style={{position:'relative',zIndex:2}}>{children}</div>
    {alarm&&<div className="alarm"><div className="ic">🚨</div><h1>{alarm.text}</h1><Btn big c="#fff" onClick={ack}>ENTENDIDO — silenciar</Btn></div>}</>;
}
function TopBar({title,tabs,tab,setTab,extra}){
  const {me,logout,notifs}=useC();
  const [lastSeen,setLS]=useState(()=>+localStorage.getItem('cda_ls')||0);
  const cnt=notifs.filter(n=>visible(n,me)&&n.ts>lastSeen).length;
  useEffect(()=>{if(tab==='alertas'){const t=Date.now();localStorage.setItem('cda_ls',t);setLS(t)}},[tab,notifs.length]);
  return <><header className="top"><h1>{title}</h1><span className="sp"/><span className="muted" style={{fontSize:13}}>{me.name}</span>{extra}<InstallBtn/><Btn sm c="var(--rd)" onClick={logout}>Salir</Btn></header>
  {tabs&&<div className="tabs">{tabs.map(([k,l])=><Btn key={k} sm c={tab===k?'var(--mg)':'var(--cy)'} onClick={()=>setTab(k)}>{l}{k==='alertas'&&cnt>0?` 🔴${cnt}`:''}</Btn>)}</div>}</>;
}

  const [f,setF]=useState(w||{name:'',desc:'',assignedTo:[],start:today(),end:today(),progress:0,activities:[]});
  const staff=users.filter(u=>['mantenimiento','sistemas'].includes(u.role));
  const setAct=(i,k,v)=>setF({...f,activities:f.activities.map((a,j)=>j===i?{...a,[k]:v}:a)});
  const save=async()=>{if(!f.name)return msg('Nombre de la obra requerido');const id=f.id||uid();await DB.set('works',id,{...f,id:undefined,created:f.created||Date.now()});
    notify({dept:'mantenimiento',text:`Obra ${f.id?'actualizada':'creada'}: ${f.name}`,targets:f.assignedTo});onClose()};
  return <Modal title={f.id?'Editar obra':'Nueva obra civil'} onClose={onClose}>
    <F l="Nombre de la obra"><input value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></F>
    <F l="Descripción"><textarea rows={2} value={f.desc} onChange={e=>setF({...f,desc:e.target.value})}/></F>
    <div className="row"><div className="sp"><F l="Inicio"><input type="date" value={f.start} onChange={e=>setF({...f,start:e.target.value})}/></F></div><div className="sp"><F l="Fin"><input type="date" value={f.end} onChange={e=>setF({...f,end:e.target.value})}/></F></div></div>
    <F l="Personal asignado"><Pick users={staff} value={f.assignedTo} onChange={v=>setF({...f,assignedTo:v})}/></F>
    {!f.activities.length&&<F l={`Avance manual: ${f.progress}%`}><input type="range" min="0" max="100" step="5" value={f.progress} onChange={e=>setF({...f,progress:+e.target.value})}/></F>}
    <h3>Cronograma de actividades</h3>
    {f.activities.map((a,i)=><div key={i} className="glass" style={{marginBottom:8,padding:10}}>
      <input placeholder="Actividad" value={a.name} onChange={e=>setAct(i,'name',e.target.value)}/>
      <div className="row"><div className="sp"><label className="f">Inicio</label><input type="date" value={a.start} onChange={e=>setAct(i,'start',e.target.value)}/></div><div className="sp"><label className="f">Fin</label><input type="date" value={a.end} onChange={e=>setAct(i,'end',e.target.value)}/></div></div>
      <label className="f">Responsable</label><select value={a.who||''} onChange={e=>setAct(i,'who',e.target.value)}><option value="">—</option>{staff.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select>
      <label className="f">Avance {a.progress}% · {days(a.start,a.end)} día(s)</label><input type="range" min="0" max="100" step="5" value={a.progress} onChange={e=>setAct(i,'progress',+e.target.value)}/>
      <Btn sm c="var(--rd)" onClick={()=>setF({...f,activities:f.activities.filter((_,j)=>j!==i)})}>Quitar</Btn></div>)}
    <Btn sm c="var(--gr)" onClick={()=>setF({...f,activities:[...f.activities,{name:'',start:f.start,end:f.end,progress:0,who:''}]})}>＋ Actividad</Btn>
    <div className="row" style={{marginTop:12}}><Btn c="var(--gr)" onClick={save}>Guardar obra</Btn></div></Modal>;
}
function WorksView({readOnly,mine}){
  const {works,users,me}=useC();const [ed,setEd]=useState(null);
  const list=works.filter(w=>!mine||w.assignedTo?.includes(me.id)).sort((a,b)=>(b.created||0)-(a.created||0));
  return <div>{!readOnly&&<Btn c="var(--gr)" onClick={()=>setEd(false)}>＋ Nueva obra civil</Btn>}{!list.length&&<p className="muted">Sin obras.</p>}
  <div className="grid2" style={{marginTop:12}}>{list.map(w=>{const p=wProg(w),pl=planned(w.start,w.end),span=Math.max(1,new Date(w.end)-new Date(w.start));
    return <div key={w.id} className="glass"><div className="row"><b className="sp">🏗 {w.name}</b>{p<pl-10&&p<100&&<Chip c="var(--rd)">atrasada</Chip>}{p>=100&&<Chip c="var(--gr)">terminada</Chip>}</div>
    <div className="muted" style={{fontSize:12.5}}>📅 {w.start} → {w.end} · {days(w.start,w.end)} días · 👤 {(w.assignedTo||[]).map(i=>users.find(u=>u.id===i)?.name).filter(Boolean).join(', ')||'—'}</div>
    <Progress v={p} label="Avance real"/><Progress v={pl} label="Avance planeado (tiempo)"/>
    {w.activities?.map((a,i)=>{const l=clamp((new Date(a.start)-new Date(w.start))/span*100,0,100),wd=clamp((new Date(a.end)-new Date(a.start)+864e5)/span*100,2,100-l);
      return <div key={i} style={{marginTop:6}}><div className="row" style={{fontSize:12.5}}><span className="sp">{a.name||'Actividad'} <span className="muted">({a.start}→{a.end}{a.who?' · '+users.find(u=>u.id===a.who)?.name:''})</span></span><b>{a.progress}%</b></div><div className="gantt"><i style={{left:l+'%',width:wd+'%',opacity:.35+a.progress/160}}/></div></div>})}
    {!readOnly&&<div className="row" style={{marginTop:8}}><Btn sm onClick={()=>setEd(w)}>✏ Editar</Btn><Btn sm c="#64748b" onClick={()=>confirm('¿Eliminar obra?')&&DB.del('works',w.id)}>🗑</Btn></div>}</div>})}</div>
  {ed!==null&&<WorkForm w={ed||undefined} onClose={()=>setEd(null)}/>}</div>;
}

/* ============ Resumen de mantenimiento ============ */
function MaintOverview(){
  const {tasks,works,users}=useC();
  const done=tasks.filter(t=>t.status==='completada').length,cur=tasks.filter(t=>t.status==='en_curso').length,ov=tasks.filter(overdue).length;
  const avgT=tasks.length?tasks.reduce((s,t)=>s+(+t.progress||0),0)/tasks.length:0,avgW=works.length?works.reduce((s,w)=>s+wProg(w),0)/works.length:0;
  const types=[...new Set(tasks.map(t=>t.type))].map(ty=>{const l=tasks.filter(t=>t.type===ty);return{ty,n:l.length,p:l.reduce((s,t)=>s+(+t.progress||0),0)/l.length}});
  const ppl=users.filter(u=>['mantenimiento','sistemas'].includes(u.role)).map(u=>{const l=tasks.filter(t=>t.assignedTo?.includes(u.id));return{u,n:l.length,d:l.filter(t=>t.status==='completada').length,p:l.length?l.reduce((s,t)=>s+(+t.progress||0),0)/l.length:0}});
  return <div><div className="grid"><Stat c="var(--cy)" v={tasks.length} l="Tareas totales"/><Stat c="var(--gr)" v={done} l="Completadas"/><Stat c="var(--am)" v={cur} l="En curso"/><Stat c="var(--rd)" v={ov} l="Vencidas"/><Stat c="var(--mg)" v={Math.round(tasks.length?done/tasks.length*100:0)+'%'} l="% de ejecución (completadas)"/><Stat c="var(--bl)" v={Math.round(avgT)+'%'} l="Avance promedio tareas"/><Stat c="var(--am)" v={works.length} l="Obras civiles"/><Stat c="var(--gr)" v={Math.round(avgW)+'%'} l="Avance promedio de obras"/></div>
  <div className="grid2" style={{marginTop:12}}><div className="glass"><h3>Por tipo de tarea</h3>{types.map(x=><div key={x.ty} style={{marginBottom:8}}><Progress v={x.p} label={`${x.ty} (${x.n})`}/></div>)}{!types.length&&<span className="muted">Sin datos</span>}</div>
  <div className="glass"><h3>Por trabajador</h3>{ppl.map(x=><div key={x.u.id} style={{marginBottom:8}}><Progress v={x.p} label={`${x.u.name} · ${x.d}/${x.n} completadas`}/></div>)}{!ppl.length&&<span className="muted">Sin personal</span>}</div>
  <div className="glass"><h3>Avance de obras</h3>{works.map(w=><div key={w.id} style={{marginBottom:8}}><Progress v={wProg(w)} label={w.name}/></div>)}{!works.length&&<span className="muted">Sin obras</span>}</div></div></div>;
}

/* ============ App Servicio / Aseo ============ */
function CleanApp({hash}){
  const {me,rooms,notify,msg}=useC();
  const [scan,setScan]=useState(false),[tab,setTab]=useState('hab'),handled=useRef('');
  const mine=rooms.filter(r=>!(r.assignedTo?.length)||r.assignedTo.includes(me.id)).sort((a,b)=>a.number.localeCompare(b.number,undefined,{numeric:true}));
  const start=r=>{
    if(r.status==='proceso')return r.startedBy===me.id?msg('Ya iniciaste esta habitación — pulsa Finalizar'):msg('La está limpiando '+r.startedByName);
    if(r.status!=='limpieza')return msg(`Hab. ${r.number}: no está liberada por recepción (${ST[r.status].l})`);
    DB.set('rooms',r.id,{status:'proceso',startedAt:Date.now(),startedBy:me.id,startedByName:me.name});msg('⏱ Aseo iniciado — Hab. '+r.number)};
  const finish=r=>{const end=Date.now(),dur=end-r.startedAt;
    DB.set('cleanings',uid(),{roomId:r.id,number:r.number,workerId:me.id,workerName:me.name,start:r.startedAt,end,dur,day:today()});
    DB.set('rooms',r.id,{status:'disponible',startedAt:null,startedBy:null,startedByName:null});
    notify({dept:'aseo',text:`Hab. ${r.number} lista — ${me.name} tardó ${fmt(dur)}`,targets:[]});msg(`✅ Hab. ${r.number} disponible (${fmt(dur)})`)};
  const onScan=text=>{const m=/room=([\w-]+)/.exec(text);const r=m?rooms.find(x=>x.id===m[1]):rooms.find(x=>x.number===String(text).trim());if(!r)return msg('QR no reconocido');
    if(r.status==='proceso'&&r.startedBy===me.id)finish(r);else start(r)};
  useEffect(()=>{const m=/room=([\w-]+)/.exec(hash);if(m&&rooms.length&&handled.current!==m[1]){handled.current=m[1];onScan(hash)}},[hash,rooms.length]);
  const cl=useCol('cleanings');const my=cl.filter(c=>c.workerId===me.id&&c.day===today());
  return <><TopBar title="Servicio · Aseo" tabs={[['hab','🛏 Habitaciones'],['hist','⏱ Mis tiempos'],['alertas','🔔 Alertas']]} tab={tab} setTab={setTab}/><div className="wrap">
    {tab==='hab'&&<><div className="row" style={{marginBottom:10}}><Btn big c="var(--gr)" onClick={()=>setScan(true)}>📷 Escanear QR</Btn>{Object.entries(ST).map(([k,s])=><Chip key={k} c={s.c}>{s.l}: {mine.filter(r=>r.status===k).length}</Chip>)}</div>
      <div className="grid">{mine.map(r=><RoomCard key={r.id} r={r}>{r.status==='proceso'&&r.startedBy===me.id&&<Btn c="var(--gr)" onClick={()=>finish(r)}>✔ Finalizar</Btn>}</RoomCard>)}</div>{!mine.length&&<p className="muted">No tienes habitaciones asignadas.</p>}</>}
    {tab==='hist'&&<div className="glass"><h3>Hoy: {my.length} habitaciones</h3><div className="tw"><table><tbody>{my.sort((a,b)=>b.end-a.end).map(c=><tr key={c.id}><td><b>Hab. {c.number}</b></td><td>{dfmt(c.end)}</td><td>{fmt(c.dur)}</td></tr>)}</tbody></table></div></div>}
    {tab==='alertas'&&<Alerts/>}</div><FloatBubbles list={mine.filter(r=>r.startedBy===me.id)}/>{scan&&<Scanner onClose={()=>setScan(false)} onText={t=>{setScan(false);onScan(t)}}/>}</>;
}
function Scanner({onClose,onText}){
  const [man,setMan]=useState('');
  useEffect(()=>{let q;try{q=new Html5Qrcode('reader');q.start({facingMode:'environment'},{fps:10,qrbox:230},t=>{q.stop().catch(()=>{});onText(t)},()=>{}).catch(()=>{})}catch(e){}
    return()=>{try{q&&q.isScanning&&q.stop().catch(()=>{})}catch(e){}}},[]);
  return <Modal title="Escanear QR de la habitación" onClose={onClose}><div id="reader" style={{width:'100%',minHeight:260}}/><F l="¿Sin cámara? Escribe el número"><div className="row"><input className="sp" value={man} onChange={e=>setMan(e.target.value)} inputMode="numeric"/><Btn onClick={()=>man&&onText(man)}>OK</Btn></div></F></Modal>;
}

/* ============ ENTREGAS: utilidades ============ */
const collected=i=>{if(!['ok','novedad','parcial'].includes(i.status))return{cash:0,transfer:0,credit:0};
  const ret=(i.returned||[]).reduce((s,p)=>s+p.qty*(p.price||0),0),net=Math.max(0,(+i.value||0)-ret),k=(+i.value)?net/(+i.value):1;
  if(i.payType==='credito')return{cash:0,transfer:0,credit:net};
  if(i.payType==='transferencia')return{cash:0,transfer:net,credit:0};
  if(i.payType==='mixta')return{cash:(+i.cash||0)*k,transfer:(+i.transfer||0)*k,credit:0};
  return{cash:net,transfer:0,credit:0}};
const normKey=k=>String(k).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function parseProducts(s){return String(s||'').split(/;|\n/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=/^(.*?)\s*[x×]\s*(\d+(?:[.,]\d+)?)(?:\s*@\s*\$?([\d.,]+))?$/i.exec(x);return m?{name:m[1].trim(),qty:+m[2].replace(',','.'),price:+(m[3]||0).toString().replace(/[.,]/g,'')}:{name:x,qty:1,price:0}})}
function parseSheet(rows){return rows.map(r=>{const o={};Object.keys(r).forEach(k=>o[normKey(k)]=r[k]);
  const pay=normKey(o.tipopago||o.pago||o.tipo||o.metodo||'contado');const pt=pay.includes('cred')?'credito':pay.includes('trans')?'transferencia':pay.includes('mix')?'mixta':'contado';
  return{number:String(o.factura||o.numero||o.nro||o.numerofactura||'').trim(),client:o.cliente||'',address:o.direccion||'',value:+String(o.valor||o.total||0).replace(/[^\d.]/g,'')||0,payType:pt,cash:+o.efectivo||0,transfer:+o.transferencia||0,products:parseProducts(o.productos||o.detalle)}}).filter(r=>r.number)}

function RouteForm({onClose}){
  const {users,msg,notify}=useC();
  const [r,setR]=useState({name:'',date:today(),driverId:'',auxId:'',vehicle:''}),[inv,setInv]=useState([]);

  const up=(i,k,v)=>setInv(inv.map((x,j)=>j===i?{...x,[k]:v}:x));
  const file=async e=>{const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer());const rows=parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}));
    if(!rows.length)return msg('No se encontraron facturas. Revisa los encabezados (use la plantilla).');
    setInv([...inv,...rows.map(x=>({...x,productsText:x.products.map(p=>`${p.name} x${p.qty}${p.price?' @'+p.price:''}`).join('; ')}))]);msg(rows.length+' facturas cargadas');e.target.value=''};
  const tpl=()=>{const ws=XLSX.utils.json_to_sheet([{Factura:'F-1001',Cliente:'Tienda La Esquina',Direccion:'Cra 10 # 20-30',Valor:250000,TipoPago:'mixta',Efectivo:100000,Transferencia:150000,Productos:'Arroz x10 @8000; Aceite x5 @14000'}]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Facturas');XLSX.writeFile(wb,'plantilla_facturas.xlsx')};

    <h3>Facturas ({inv.length})</h3>

    {inv.map((x,i)=><div key={i} className="glass" style={{margin:'8px 0',padding:10}}>
